<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lisossomos 🧬 - Gestão Financeira</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #f8fafc; color: #0f172a; padding: 24px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 800px; background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { color: #0284c7; margin-bottom: 16px; font-size: 1.5rem; }
        .form-group { margin-bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
        input, select { padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; }
        button { background-color: #0284c7; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #02699d; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; border-bottom: 1px solid #e2e8f0; text-align: left; }
        th { background: #f1f5f9; color: #475569; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧬 Lisossomos - Sincronização Supabase</h1>
        
        <form id="txForm" onsubmit="addTx(event)">
            <div class="form-group">
                <label>Descrição</label>
                <input type="text" id="desc" placeholder="Ex: Mercado" required>
            </div>
            <div class="form-group">
                <label>Valor (R$)</label>
                <input type="number" id="amount" step="0.01" placeholder="0.00" required>
            </div>
            <div class="form-group">
                <label>Tipo</label>
                <select id="type">
                    <option value="despesa">Despesa (-)</option>
                    <option value="receita">Receita (+)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Data</label>
                <input type="date" id="date" required>
            </div>
            <button type="submit">Salvar e Sincronizar</button>
        </form>

        <h2>Lançamentos Sincronizados</h2>
        <table>
            <thead>
                <tr><th>Data</th><th>Descrição</th><th>Valor</th></tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="3" style="text-align: center;">A carregar dados da nuvem...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const SUPABASE_URL = 'https://ehxvnbdcwinnfqxstwxz.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_MUOFOFH-MazsELbh7J5zw_SJA80';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('date').value = new Date().toISOString().slice(0, 10);

        async function loadTxs() {
            const { data, error } = await supabaseClient.from('transactions').select('*').order('id', { ascending: false });
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (error) {
                tbody.innerHTML = `<tr><td colspan="3" style="color: red;">Erro ao carregar: ${error.message}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align: center;">Nenhum lançamento encontrado.</td></tr>`;
                return;
            }

            data.forEach(t => {
                tbody.insertAdjacentHTML('beforeend', `
                    <tr>
                        <td>${t.date}</td>
                        <td><strong>${t.desc}</strong></td>
                        <td style="color: ${t.type === 'receita' ? 'green' : 'red'};">R$ ${t.amount}</td>
                    </tr>
                `);
            });
        }

        async function addTx(e) {
            e.preventDefault();
            const tx = {
                id: Date.now(),
                "desc": document.getElementById('desc').value,
                amount: parseFloat(document.getElementById('amount').value),
                type: document.getElementById('type').value,
                date: document.getElementById('date').value,
                account: "Banco do Brasil",
                category: "Geral",
                status: "pago",
                recurrence: "unico"
            };

            const { error } = await supabaseClient.from('transactions').insert([tx]);
            if (error) {
                alert('Erro ao guardar no Supabase: ' + error.message);
                return;
            }

            document.getElementById('txForm').reset();
            document.getElementById('date').value = new Date().toISOString().slice(0, 10);
            loadTxs();
            alert('Salvo com sucesso na nuvem!');
        }

        loadTxs();
    </script>
</body>
</html>
