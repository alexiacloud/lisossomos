<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lisossomos 🧬 - Gestão Financeira Inteligente (Sincronizado)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-body: #f8fafc; --bg-card: #ffffff; --text-main: #0f172a; --text-muted: #64748b;
            --primary: #0284c7; --primary-light: #e0f2fe; --success: #10b981; --success-light: #ecfdf5;
            --danger: #ef4444; --danger-light: #fef2f2; --warning: #f59e0b; --warning-light: #fffbeb;
            --border: #e2e8f0; --radius: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); display: flex; min-height: 100vh; }
        aside { width: 270px; background-color: var(--bg-card); border-right: 1px solid var(--border); padding: 24px 16px; display: flex; flex-direction: column; justify-content: space-between; position: fixed; height: 100vh; top: 0; left: 0; z-index: 10; }
        .brand { display: flex; align-items: center; gap: 12px; font-size: 1.25rem; font-weight: 800; color: var(--primary); padding: 0 12px 20px 12px; border-bottom: 1px solid var(--border); }
        .nav-menu { list-style: none; margin-top: 16px; display: flex; flex-direction: column; gap: 6px; }
        .nav-item button { width: 100%; background: none; border: none; padding: 10px 14px; border-radius: var(--radius); color: var(--text-muted); font-size: 0.88rem; font-weight: 600; display: flex; align-items: center; gap: 10px; cursor: pointer; text-align: left; }
        .nav-item button:hover, .nav-item button.active { background-color: var(--primary-light); color: var(--primary); }
        main { margin-left: 270px; flex: 1; padding: 32px; max-width: 1300px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
        .card-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 24px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
        th, td { padding: 12px; border-bottom: 1px solid var(--border); }
        th { color: var(--text-muted); background-color: #fafafa; }
        .btn-primary { background-color: var(--primary); color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group input, .form-group select { padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; outline: none; }
        .view-section { display: none !important; }
        .view-section.active { display: flex !important; flex-direction: column; gap: 24px; }
    </style>
</head>
<body>
    <aside>
        <div>
            <div class="brand"><span>🧬</span><span>Lisossomos</span></div>
            <ul class="nav-menu">
                <li class="nav-item"><button class="active" onclick="switchView('dashboard', this)">📊 Dashboard</button></li>
                <li class="nav-item"><button onclick="switchView('transactions', this)">💸 Lançamentos</button></li>
                <li class="nav-item"><button onclick="switchView('settings', this)">⚙️ Configurações</button></li>
            </ul>
        </div>
    </aside>
    <main>
        <div class="top-bar">
            <h1>Visão Geral - Sincronizado ☁️</h1>
        </div>
        <section id="view-dashboard" class="view-section active">
            <div class="card-panel">
                <h2>Saldo Líquido: <span id="totalBalance" style="color:var(--primary)">R$ 0,00</span></h2>
            </div>
        </section>
        <section id="view-transactions" class="view-section">
            <div class="card-panel">
                <h2>Novo Lançamento</h2>
                <form id="transactionForm" onsubmit="addTransaction(event)">
                    <div class="form-grid">
                        <div class="form-group"><label>Descrição</label><input type="text" id="txDesc" required></div>
                        <div class="form-group"><label>Valor (R$)</label><input type="number" id="txAmount" step="0.01" required></div>
                        <div class="form-group"><label>Tipo</label><select id="txType"><option value="despesa">Despesa</option><option value="receita">Receita</option></select></div>
                        <div class="form-group"><label>Data</label><input type="date" id="txDate" required></div>
                    </div>
                    <button type="submit" class="btn-primary">Salvar Lançamento</button>
                </form>
            </div>
            <div class="card-panel">
                <h2>Histórico</h2>
                <table>
                    <thead><tr><th>Data</th><th>Descrição</th><th>Valor</th></tr></thead>
                    <tbody id="transactionsTable"></tbody>
                </table>
            </div>
        </section>
        <section id="view-settings" class="view-section">
            <div class="card-panel"><h2>Configurações</h2><p>Conectado ao Supabase com sucesso.</p></div>
        </section>
    </main>
    <script>
        const SUPABASE_URL = 'https://ehxvnbdcwinnfqxstwxz.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_MUOFOFH-MazsELbh7J5zw_SJA80';
        let supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        let state = {
            transactions: JSON.parse(localStorage.getItem('fin_txs') || '[]')
        };

        document.addEventListener("DOMContentLoaded", async () => {
            document.getElementById('txDate').value = new Date().toISOString().slice(0, 10);
            if (supabaseClient) {
                const { data } = await supabaseClient.from('transactions').select('*');
                if (data && data.length > 0) {
                    state.transactions = data;
                    localStorage.setItem('fin_txs', JSON.stringify(data));
                }
            }
            renderTable();
            updateDashboard();
        });

        async function addTransaction(e) {
            e.preventDefault();
            const tx = {
                id: Date.now(),
                "desc": document.getElementById('txDesc').value,
                amount: parseFloat(document.getElementById('txAmount').value),
                type: document.getElementById('txType').value,
                date: document.getElementById('txDate').value,
                account: "Banco do Brasil",
                category: "Geral",
                status: "pago",
                recurrence: "unico"
            };
            state.transactions.push(tx);
            localStorage.setItem('fin_txs', JSON.stringify(state.transactions));
            if (supabaseClient) {
                await supabaseClient.from('transactions').upsert([tx]);
            }
            document.getElementById('transactionForm').reset();
            document.getElementById('txDate').value = new Date().toISOString().slice(0, 10);
            renderTable();
            updateDashboard();
            alert('Salvo com sucesso!');
        }

        function renderTable() {
            const tbody = document.getElementById('transactionsTable');
            if (!tbody) return;
            tbody.innerHTML = '';
            state.transactions.forEach(t => {
                tbody.insertAdjacentHTML('beforeend', `<tr><td>${t.date}</td><td><strong>${t.desc}</strong></td><td style="color:${t.type==='receita'?'green':'red'}">R$ ${t.amount}</td></tr>`);
            });
        }

        function updateDashboard() {
            const total = state.transactions.reduce((acc, t) => t.type === 'receita' ? acc + t.amount : acc - t.amount, 0);
            const el = document.getElementById('totalBalance');
            if(el) el.innerText = total.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function switchView(viewName, btn) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item button').forEach(el => el.classList.remove('active'));
            document.getElementById(`view-${viewName}`).classList.add('active');
            if(btn) btn.classList.add('active');
        }
    </script>
</body>
</html>
